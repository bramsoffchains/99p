[package]
name = "ykvault-core"
description = "Offline vault core for 99passwords: YubiKey PIV storage, crypto, schema, TOTP, generator"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["mock", "eff-wordlist"]
# In-memory YubiKey emulator used by the tests.
mock = []
# Embed the EFF large Diceware list (CC-BY 3.0 US) for passphrase generation.
eff-wordlist = []

# Every dependency is a pure-Rust RustCrypto / miniz crate. No async runtime,
# no networking, no proc-macros, no C build scripts. `cargo tree` must stay
# free of tokio/hyper/reqwest/rustls/openssl/cc/bindgen/syn (checked by scripts/check.sh).
[dependencies]
aes = "0.9.4"
chacha20poly1305 = { version = "0.11.0", default-features = false, features = ["alloc"] }
des = "0.9.0"
getrandom = "0.4.3"
hkdf = "0.13.0"
hmac = "0.13.0"
miniz_oxide = { version = "0.9.1", default-features = false, features = ["with-alloc"] }
p256 = { version = "0.14.0", default-features = false, features = ["arithmetic", "ecdh"] }
sha1 = { version = "0.11.0", default-features = false }
sha2 = { version = "0.11.2", default-features = false }
zeroize = { version = "1.9.2", default-features = false, features = ["alloc"] }
